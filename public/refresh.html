<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>최신 버전 적용 중</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fffaf0;
        color: #3e3933;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 420px);
        border: 1px solid #e8dfd1;
        border-radius: 20px;
        background: #fffdf9;
        padding: 28px 22px;
        text-align: center;
        box-shadow: 0 12px 36px rgba(72, 58, 38, 0.08);
      }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 12px 0 0; color: #6b645c; font-size: 14px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>최신 버전을 적용하고 있습니다</h1>
      <p>기존 모바일 캐시를 정리한 뒤 배경 제거 화면을 다시 엽니다.</p>
    </main>
    <script>
      (async () => {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
        } catch {
          // Cache cleanup is best-effort; navigation must still continue.
        }
        window.location.replace(`/background-remover/?alpha=v7&refresh=${Date.now()}`);
      })();
    </script>
  </body>
</html>
