name: Temporary Theme Sort Memo Source Migration

on:
  push:
    branches:
      - cleanup/theme-sort-memo-source

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/theme-sort-memo-source
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Patch theme sort memoization into source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          vite_path = Path('vite.tailwind-motion-cleanup.config.js')

          app = app_path.read_text()
          app_anchor = """  const sortedThemeKeys = [...themeKeys].sort((a, b) => {
            const scoreA = themeStats[a] || 0;
            const scoreB = themeStats[b] || 0;
            return scoreB - scoreA;
          });""".replace('\n          ', '\n')
          app_replacement = """  const sortedThemeKeys = React.useMemo(() => [...themeKeys].sort((a, b) => {
            const scoreA = themeStats[a] || 0;
            const scoreB = themeStats[b] || 0;
            return scoreB - scoreA;
          }), [themeKeys, themeStats]);""".replace('\n          ', '\n')
          app_count = app.count(app_anchor)
          print(f'app theme sort anchor count={app_count}')
          if app_count != 1:
              raise SystemExit(f'Expected exactly one App theme sort anchor, found {app_count}')
          app = app.replace(app_anchor, app_replacement)
          if app.count('const sortedThemeKeys = React.useMemo(() => [...themeKeys].sort((a, b) => {') != 1:
              raise SystemExit('memoized sortedThemeKeys source block was not written exactly once')
          app_path.write_text(app)

          vite = vite_path.read_text()
          start_marker = '      const themeSortAnchor = `  const sortedThemeKeys = [...themeKeys].sort((a, b) => {'
          end_marker = '      )\n\n      return { code: transformed, map: null }'
          start = vite.find(start_marker)
          end = vite.find(end_marker, start)
          print(f'vite theme transform start={start} end={end}')
          if start < 0 or end < 0:
              raise SystemExit('Expected Vite theme sort transform block was not found')
          block = vite[start:end + len('      )\n\n')]
          if block.count('themeSortAnchor') != 3 or '[sort-memoization] theme sort anchor was not found' not in block:
              raise SystemExit('Vite theme sort transform block boundaries were not exact')
          vite = vite[:start] + vite[end + len('      )\n\n'):]
          vite_path.write_text(vite)
          PY
      - name: Verify intended diff only
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/App.jsx vite.tailwind-motion-cleanup.config.js "
          test "$(grep -F -c 'const sortedThemeKeys = React.useMemo(() => [...themeKeys].sort((a, b) => {' src/App.jsx)" = "1"
          ! grep -Fq 'const sortedThemeKeys = [...themeKeys].sort((a, b) => {' src/App.jsx
          ! grep -Fq 'const themeSortAnchor =' vite.tailwind-motion-cleanup.config.js
          grep -Fq '/\\btransition-all\\b/g' vite.tailwind-motion-cleanup.config.js
          grep -Fq 'const sortedGoldenCombos = React.useMemo(() => [...ALL_GOLDEN_COMBOS].sort((a, b) => {' src/App.jsx
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source migration
        shell: bash
        run: |
          rm .github/workflows/temp-theme-sort-memo-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx vite.tailwind-motion-cleanup.config.js .github/workflows/temp-theme-sort-memo-source.yml
          git commit -m "Move theme sort memoization into source [skip ci]"
          git push origin HEAD:cleanup/theme-sort-memo-source
