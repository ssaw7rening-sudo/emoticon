name: Apply zero-alpha source restore

on:
  push:
    branches: [main]
    paths:
      - '_tmp_restore_zero_alpha_from_source.py'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply source-based alpha restoration
        run: python _tmp_restore_zero_alpha_from_source.py

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Commit final fix
        run: |
          rm -f _tmp_restore_zero_alpha_from_source.py
          rm -f .github/workflows/apply-zero-alpha-source-restore.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vite.tailwind-motion-cleanup.config.js _tmp_restore_zero_alpha_from_source.py .github/workflows/apply-zero-alpha-source-restore.yml
          git commit -m 'Restore zero-alpha bright pixels from original sheet'
          git push
