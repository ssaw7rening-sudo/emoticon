name: Update Remover Heading

on:
  push:
    paths:
      - '.github/workflows/update-remover-heading.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update heading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/BackgroundRemoverLanding.jsx')
          s = p.read_text(encoding='utf-8')
          old = "title: '무료 이미지 배경 제거 · 누끼 따기',"
          new = "title: '무료 이미지 배경 제거 · 투명 PNG 만들기',"
          if old not in s:
              raise SystemExit('Korean landing title not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BackgroundRemoverLanding.jsx
          git commit -m 'Simplify background remover landing heading'
          git push
