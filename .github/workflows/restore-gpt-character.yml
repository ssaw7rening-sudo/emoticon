name: Restore GPT character helper

on:
  push:
    paths:
      - '.github/workflows/restore-gpt-character.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore original GPT helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          snippet = Path('.github/patches/gpt-character-original.jsx.txt').read_text(encoding='utf-8').rstrip()
          if '  const getGptCharacterDetails = () => {' not in text:
              marker = '\n\n  const getGptBackgroundInstruction ='
              pos = text.index(marker)
              text = text[:pos] + '\n\n' + snippet + text[pos:]
              path.write_text(text, encoding='utf-8')
              print('Restored original GPT helper')
          else:
              print('GPT helper already present; no change')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Restore original GPT character helper"
          git push
