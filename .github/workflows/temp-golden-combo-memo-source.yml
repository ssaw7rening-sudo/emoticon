name: Temporary Golden Combo Memo Source Migration

on:
  push:
    branches:
      - cleanup/golden-combo-memo-source

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/golden-combo-memo-source
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Patch golden combo memoization into source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          vite_path = Path('vite.tailwind-motion-cleanup.config.js')

          app = app_path.read_text()
          app_anchor = '''  const sortedGoldenCombos = [...ALL_GOLDEN_COMBOS].sort((a, b) => {
            const isSeasonA = (a.seasonMonths || []).includes(currentMonth) ? 100 : 0;
            const isSeasonB = (b.seasonMonths || []).includes(currentMonth) ? 100 : 0;
            const scoreA = (comboStats[a.id] || 0) + isSeasonA;
            const scoreB = (comboStats[b.id] || 0) + isSeasonB;
            return scoreB - scoreA;
          });'''.replace('\n          ', '\n')
          app_replacement = '''  const sortedGoldenCombos = React.useMemo(() => [...ALL_GOLDEN_COMBOS].sort((a, b) => {
            const isSeasonA = (a.seasonMonths || []).includes(currentMonth) ? 100 : 0;
            const isSeasonB = (b.seasonMonths || []).includes(currentMonth) ? 100 : 0;
            const scoreA = (comboStats[a.id] || 0) + isSeasonA;
            const scoreB = (comboStats[b.id] || 0) + isSeasonB;
            return scoreB - scoreA;
          }), [comboStats, currentMonth]);'''.replace('\n          ', '\n')
          app_count = app.count(app_anchor)
          print(f'app golden anchor count={app_count}')
          if app_count != 1:
              raise SystemExit(f'Expected exactly one App golden combo anchor, found {app_count}')
          app = app.replace(app_anchor, app_replacement)
          if app.count('const sortedGoldenCombos = React.useMemo(() => [...ALL_GOLDEN_COMBOS].sort((a, b) => {') != 1:
              raise SystemExit('memoized sortedGoldenCombos source block was not written exactly once')
          app_path.write_text(app)

          vite = vite_path.read_text()
          vite_block = '''      const goldenAnchor = `  const sortedGoldenCombos = [...ALL_GOLDEN_COMBOS].sort((a, b) => {\\n    const isSeasonA = (a.seasonMonths || []).includes(currentMonth) ? 100 : 0;\\n    const isSeasonB = (b.seasonMonths || []).includes(currentMonth) ? 100 : 0;\\n    const scoreA = (comboStats[a.id] || 0) + isSeasonA;\\n    const scoreB = (comboStats[b.id] || 0) + isSeasonB;\\n    return scoreB - scoreA;\\n  });`
          if (!transformed.includes(goldenAnchor)) {
            throw new Error('[sort-memoization] golden combo sort anchor was not found')
          }
          transformed = transformed.replace(
            goldenAnchor,
            `  const sortedGoldenCombos = React.useMemo(() => [...ALL_GOLDEN_COMBOS].sort((a, b) => {\\n    const isSeasonA = (a.seasonMonths || []).includes(currentMonth) ? 100 : 0;\\n    const isSeasonB = (b.seasonMonths || []).includes(currentMonth) ? 100 : 0;\\n    const scoreA = (comboStats[a.id] || 0) + isSeasonA;\\n    const scoreB = (comboStats[b.id] || 0) + isSeasonB;\\n    return scoreB - scoreA;\\n  }), [comboStats, currentMonth]);`
          )

'''.replace('\n          ', '\n      ')
          vite_count = vite.count(vite_block)
          print(f'vite golden transform block count={vite_count}')
          if vite_count != 1:
              raise SystemExit(f'Expected exactly one Vite golden combo transform block, found {vite_count}')
          vite = vite.replace(vite_block, '')
          vite_path.write_text(vite)
          PY
      - name: Verify intended diff only
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/App.jsx vite.tailwind-motion-cleanup.config.js "
          test "$(grep -F -c 'const sortedGoldenCombos = React.useMemo(() => [...ALL_GOLDEN_COMBOS].sort((a, b) => {' src/App.jsx)" = "1"
          ! grep -Fq 'const sortedGoldenCombos = [...ALL_GOLDEN_COMBOS].sort((a, b) => {' src/App.jsx
          ! grep -Fq 'const goldenAnchor =' vite.tailwind-motion-cleanup.config.js
          grep -Fq 'const themeSortAnchor =' vite.tailwind-motion-cleanup.config.js
          grep -Fq '/\\btransition-all\\b/g' vite.tailwind-motion-cleanup.config.js
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source migration
        shell: bash
        run: |
          rm .github/workflows/temp-golden-combo-memo-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx vite.tailwind-motion-cleanup.config.js .github/workflows/temp-golden-combo-memo-source.yml
          git commit -m "Move golden combo memoization into source [skip ci]"
          git push origin HEAD:cleanup/golden-combo-memo-source
