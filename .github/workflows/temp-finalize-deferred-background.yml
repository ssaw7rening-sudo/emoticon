name: Temporary Finalize Deferred Background

on:
  push:
    branches:
      - perf/defer-background-tools

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/defer-background-tools
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build baseline and capture entry size
        shell: bash
        run: |
          npm run build
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const match = html.match(/<script[^>]+type=["']module["'][^>]+src=["']([^"']+)["']/i) || html.match(/<script[^>]+src=["']([^"']+)["'][^>]+type=["']module["']/i);
          if (!match) throw new Error('Entry module not found');
          const file = `dist/${match[1].replace(/^\//, '')}`;
          const size = fs.statSync(file).size;
          fs.writeFileSync('/tmp/baseline-entry.json', JSON.stringify({ file, size }));
          console.log('BASELINE_ENTRY', JSON.stringify({ file, size }));
          NODE
      - name: Apply deferred background loading
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          text = app.read_text(encoding='utf-8')

          old_imports = 'import BackgroundRemover from "./components/BackgroundRemover.jsx";\nimport BackgroundRemoverLanding from "./components/BackgroundRemoverLanding.jsx";'
          new_imports = 'import DeferredBackgroundRemover from "./components/DeferredBackgroundRemover.jsx";\nconst BackgroundRemoverLanding = React.lazy(() => import("./components/BackgroundRemoverLanding.jsx"));'
          if text.count(old_imports) != 1:
              raise SystemExit(f'unexpected import block count: {text.count(old_imports)}')
          text = text.replace(old_imports, new_imports, 1)

          old_route = 'if (/(^|\\/)background-remover\\/?$/.test(locationPath)) {\n  return <BackgroundRemoverLanding lang={lang} />;\n}'
          new_route = 'if (/(^|\\/)background-remover\\/?$/.test(locationPath)) {\n  return (\n    <React.Suspense fallback={<div className="min-h-screen bg-[#FFFDF8]" />}>\n      <BackgroundRemoverLanding lang={lang} />\n    </React.Suspense>\n  );\n}'
          if text.count(old_route) != 1:
              raise SystemExit(f'unexpected landing route count: {text.count(old_route)}')
          text = text.replace(old_route, new_route, 1)

          old_embedded = '    <BackgroundRemover lang={lang} />'
          if text.count(old_embedded) != 1:
              raise SystemExit(f'unexpected embedded remover count: {text.count(old_embedded)}')
          text = text.replace(old_embedded, '    <DeferredBackgroundRemover lang={lang} />', 1)
          app.write_text(text, encoding='utf-8')
          PY

          cat > src/components/DeferredBackgroundRemover.jsx <<'EOF'
          import React, { useEffect, useRef, useState } from 'react';

          const BackgroundRemover = React.lazy(() => import('./BackgroundRemover.jsx'));

          export default function DeferredBackgroundRemover({ lang = 'ko' }) {
            const sentinelRef = useRef(null);
            const [shouldLoad, setShouldLoad] = useState(false);

            useEffect(() => {
              if (shouldLoad) return undefined;

              const node = sentinelRef.current;
              if (!node || typeof IntersectionObserver === 'undefined') {
                setShouldLoad(true);
                return undefined;
              }

              const observer = new IntersectionObserver((entries) => {
                if (entries.some((entry) => entry.isIntersecting)) {
                  setShouldLoad(true);
                  observer.disconnect();
                }
              }, { rootMargin: '1600px 0px' });

              observer.observe(node);
              return () => observer.disconnect();
            }, [shouldLoad]);

            return (
              <div ref={sentinelRef} data-deferred-background-remover style={{ minHeight: '1px' }}>
                {shouldLoad ? (
                  <React.Suspense fallback={null}>
                    <BackgroundRemover lang={lang} />
                  </React.Suspense>
                ) : null}
              </div>
            );
          }
          EOF
          git diff --check
      - name: Build optimized app and verify split
        shell: bash
        run: |
          npm run build
          node <<'NODE'
          const fs = require('fs');
          const baseline = JSON.parse(fs.readFileSync('/tmp/baseline-entry.json', 'utf8'));
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const match = html.match(/<script[^>]+type=["']module["'][^>]+src=["']([^"']+)["']/i) || html.match(/<script[^>]+src=["']([^"']+)["'][^>]+type=["']module["']/i);
          if (!match) throw new Error('Optimized entry module not found');
          const file = `dist/${match[1].replace(/^\//, '')}`;
          const size = fs.statSync(file).size;
          const savings = baseline.size - size;
          const pct = Number(((savings / baseline.size) * 100).toFixed(2));
          const assets = fs.readdirSync('dist/assets').sort();
          console.log('OPTIMIZED_ENTRY', JSON.stringify({ file, size, baselineSize: baseline.size, savings, pct }));
          if (savings <= 0) throw new Error('Initial entry did not shrink');
          if (!assets.some(name => /^BackgroundRemover-/i.test(name))) throw new Error('BackgroundRemover lazy chunk missing');
          if (!assets.some(name => /^BackgroundRemoverLanding-/i.test(name))) throw new Error('BackgroundRemoverLanding lazy chunk missing');
          if (fs.readFileSync(file, 'utf8').includes('배경 제거하기')) throw new Error('Background remover copy remains in initial entry');
          NODE
      - name: Stage exact final tree and commit
        shell: bash
        run: |
          git restore package.json package-lock.json || true
          rm .github/workflows/temp-finalize-deferred-background.yml
          git diff --check
          git add src/App.jsx src/components/DeferredBackgroundRemover.jsx .github/workflows/temp-finalize-deferred-background.yml
          CHANGED="$(git diff --cached origin/main --name-only | sort | tr '\n' ' ')"
          echo "FINAL_STAGED_FILES=$CHANGED"
          test "$CHANGED" = "src/App.jsx src/components/DeferredBackgroundRemover.jsx "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Defer background tools until needed"
          git push origin HEAD:perf/defer-background-tools
