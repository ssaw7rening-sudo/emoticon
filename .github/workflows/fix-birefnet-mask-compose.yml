name: Fix BiRefNet Mask Composition

on:
  push:
    paths:
      - '.github/workflows/fix-birefnet-mask-compose.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch mask composition
        run: python scripts/fix-birefnet-mask-compose.py
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BackgroundRemover.jsx
          git commit -m 'Harden BiRefNet mask composition'
          git push
