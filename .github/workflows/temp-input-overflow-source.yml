name: Temporary Input Overflow Source Cleanup

on:
  push:
    branches:
      - cleanup/input-overflow-source

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/input-overflow-source

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Patch source and remove dead transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          app_text = app.read_text(encoding='utf-8')
          app_old = 'transition-all overflow-x-auto whitespace-nowrap'
          app_new = 'transition-all whitespace-nowrap'
          app_count = app_text.count(app_old)
          if app_count != 1:
              raise SystemExit(f'Expected exactly 1 App input overflow anchor, found {app_count}')
          app.write_text(app_text.replace(app_old, app_new, 1), encoding='utf-8')

          config = Path('vite.tailwind-motion-cleanup.config.js')
          config_text = config.read_text(encoding='utf-8')
          config_block = """      // text inputs do not benefit from overflow scrolling; the browser already
                // handles caret/selection scrolling internally for a single-line input.
                transformed = transformed.replace(
                  'focus:border-mint-strong transition-[color,background-color,border-color,box-shadow,opacity,transform,filter] overflow-x-auto whitespace-nowrap',
                  'focus:border-mint-strong transition-[color,background-color,border-color,box-shadow,opacity,transform,filter] whitespace-nowrap'
                )

          """
          config_count = config_text.count(config_block)
          if config_count != 1:
              raise SystemExit(f'Expected exactly 1 Vite input overflow cleanup block, found {config_count}')
          config.write_text(config_text.replace(config_block, '', 1), encoding='utf-8')

          workflow = Path('.github/workflows/temp-input-overflow-source.yml')
          if not workflow.exists():
              raise SystemExit('Temporary workflow file is missing')
          workflow.unlink()
          PY

      - name: Verify intended diff only
        shell: bash
        run: |
          git diff --check
          git diff -- src/App.jsx vite.tailwind-motion-cleanup.config.js .github/workflows/temp-input-overflow-source.yml

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx vite.tailwind-motion-cleanup.config.js .github/workflows/temp-input-overflow-source.yml
          git commit -m 'Move input overflow cleanup into source [skip ci]'
          git push origin HEAD:cleanup/input-overflow-source
