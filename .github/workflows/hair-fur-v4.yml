name: Hair Fur Edge V4

on:
  push:
    branches: [improve/hair-fur-edge-refine-v4]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply hair fur v4 patch
        run: node .github/scripts/patch-hair-fur-v4.mjs
      - name: Remove temporary patch files
        run: rm .github/scripts/patch-hair-fur-v4.mjs .github/workflows/hair-fur-v4.yml
      - name: Guard initial diff
        run: |
          git diff --check
          changed="$(git diff --name-only origin/main | sort)"
          test "$changed" = "vite.hair-fur-precision-v3.config.js"
          grep -q "HAIR_FUR_FINE_DETAIL_PRECISION_V4" vite.hair-fur-precision-v3.config.js
          grep -q "HAIR_FUR_CONTINUITY_RESCUE_V4" vite.hair-fur-precision-v3.config.js
          grep -q "const bridgeRescue = bridgeLike" vite.hair-fur-precision-v3.config.js
          grep -q "fineStrand ? 0.38 : 0.30" vite.hair-fur-precision-v3.config.js
      - run: npm ci
      - run: npm run build
      - name: Restore generated build artifacts
        run: |
          git restore --source=HEAD --worktree --staged public/og 2>/dev/null || true
          git clean -fd public/og || true
      - name: Guard final diff after build
        run: |
          git diff --check
          changed="$(git diff --name-only origin/main | sort)"
          test "$changed" = "vite.hair-fur-precision-v3.config.js"
      - name: Commit verified hair fur change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.hair-fur-precision-v3.config.js
          git commit -m "Improve hair and fur strand recovery [skip ci]"
          git push origin HEAD
