name: Enlarge final settings typography

on:
  push:
    paths:
      - '.github/workflows/enlarge-final-settings-typography.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Increase final settings font sizes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          start_marker = '          {/* Final settings checkpoint after prompt preview */}'
          end_marker = '          <AdBanner />'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          replacements = [
              ('text-[14px] sm:text-[15px] font-black text-[#5C4328]', 'text-[15px] sm:text-[16px] font-black text-[#5C4328]'),
              ('text-[11px] font-bold text-[#8A6A34]', 'text-[12px] font-bold text-[#8A6A34]'),
              ('gap-y-2 text-[12.5px] sm:text-[13px]', 'gap-y-2.5 text-[13.5px] sm:text-[14px]'),
              ('block whitespace-normal leading-relaxed [word-break:keep-all] [overflow-wrap:break-word]', 'block text-[14px] sm:text-[14.5px] whitespace-normal leading-[1.65] [word-break:keep-all] [overflow-wrap:break-word]'),
              ('text-[11.5px] sm:text-[12px] font-bold text-[#8A7758] leading-relaxed', 'text-[12.5px] sm:text-[13px] font-bold text-[#8A7758] leading-relaxed'),
              ('text-[11.5px] sm:text-[12px] font-bold text-[#8A7758] mb-2', 'text-[12.5px] sm:text-[13px] font-bold text-[#8A7758] mb-2'),
              ('font-black text-[12px] sm:text-[12.5px] px-2.5', 'font-black text-[13px] sm:text-[13px] px-2.5'),
          ]

          for old, new in replacements:
              if old not in block:
                  raise SystemExit(f'Expected typography token not found: {old}')
              block = block.replace(old, new)

          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          print('Increased typography only inside final settings card.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git commit -m "Increase final settings typography"
          git push
