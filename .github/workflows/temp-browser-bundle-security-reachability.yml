name: Temporary Browser Bundle Security Reachability

on:
  push:
    branches:
      - audit/browser-bundle-security-reachability

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/browser-bundle-security-reachability
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Classify sharp references in production output
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const textExt = new Set(['.js', '.css', '.html', '.json', '.txt', '.xml', '.map']);
          const packagePatterns = [
            /onnxruntime-node/gi,
            /adm-zip/gi,
            /node_modules[\\/]sharp/gi,
            /(?:require|import)\s*\(\s*['"]sharp['"]\s*\)/gi,
            /from\s*['"]sharp['"]/gi,
            /['"]sharp['"]\s*[:;,)]/gi,
          ];
          const sharpContexts = [];
          const packageHits = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (textExt.has(path.extname(entry.name))) {
                let content;
                try { content = fs.readFileSync(full, 'utf8'); } catch { continue; }
                for (const pattern of packagePatterns) {
                  pattern.lastIndex = 0;
                  let m;
                  while ((m = pattern.exec(content))) {
                    packageHits.push({ file: full, match: m[0], index: m.index });
                    if (m[0].length === 0) break;
                  }
                }
                const lower = content.toLowerCase();
                let from = 0;
                while (true) {
                  const idx = lower.indexOf('sharp', from);
                  if (idx < 0) break;
                  sharpContexts.push({ file: full, context: content.slice(Math.max(0, idx - 120), Math.min(content.length, idx + 180)).replace(/\s+/g, ' ') });
                  from = idx + 5;
                }
              }
            }
          }

          walk('dist');
          console.log('PACKAGE_LIKE_HITS', JSON.stringify(packageHits));
          console.log('SHARP_CONTEXT_COUNT', sharpContexts.length);
          sharpContexts.slice(0, 20).forEach((x, i) => console.log(`SHARP_CONTEXT_${i + 1}`, JSON.stringify(x)));
          if (packageHits.length) {
            throw new Error(`Found ${packageHits.length} package-like vulnerable Node dependency references in dist`);
          }
          console.log('NO_PACKAGE_LIKE_NODE_DEPENDENCY_REFERENCES_IN_DIST');
          NODE
