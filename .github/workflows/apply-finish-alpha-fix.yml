name: Apply finish-stage alpha fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-finish-alpha-fix.yml'
      - '.github/scripts/fix_finish_alpha.py'

permissions:
  contents: write

concurrency:
  group: apply-finish-alpha-fix-main
  cancel-in-progress: true

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply finish-stage alpha fix
        run: python .github/scripts/fix_finish_alpha.py

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Commit final fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-finish-alpha-fix.yml .github/scripts/fix_finish_alpha.py
          git add src/components/EmoticonPostProcessor.jsx vite.tailwind-motion-cleanup.config.js
          git commit -m "Fix alpha loss in emoticon finish and auto split"
          git push origin HEAD:main
