name: Fix Footer Copyright Wrap

on:
  push:
    paths:
      - '.github/workflows/fix-footer-copyright-wrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fix footer copyright wrapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')
          old = '© {new Date().getFullYear()} Prompt Maker (프롬프트 메이커). All rights reserved.'
          new = '''<span className="block">© {new Date().getFullYear()} Prompt Maker (프롬프트 메이커).</span>
            <span className="block whitespace-nowrap">All rights reserved.</span>'''
          if old not in s:
              raise SystemExit('Footer copyright text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Fix footer copyright line break'
          git push
