name: Apply dark-sheet split rebuild

on:
  push:
    paths:
      - '_tmp_rebuild_dark_sheet_before_split.py'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply dark-sheet reconstruction
        run: python _tmp_rebuild_dark_sheet_before_split.py

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Commit final fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f _tmp_rebuild_dark_sheet_before_split.py
          rm -f .github/workflows/apply-dark-sheet-rebuild.yml
          git add -A
          git commit -m "Rebuild dark sheets from original before auto split"
          git push origin main
