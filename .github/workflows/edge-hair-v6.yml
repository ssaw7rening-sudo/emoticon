name: Edge Hair V6

on:
  push:
    branches: [improve/edge-hair-fur-v6]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply edge and hair v6 patch
        run: node .github/scripts/patch-edge-hair-v6.mjs
      - name: Remove temporary patch files
        run: rm .github/scripts/patch-edge-hair-v6.mjs .github/workflows/edge-hair-v6.yml
      - name: Guard initial diff
        run: |
          git diff --check
          changed="$(git diff --name-only origin/main | sort | tr '\n' ' ')"
          test "$changed" = "vite.hair-fur-precision-v3.config.js vite.hybrid-edge-refine.config.js "
          grep -q "HAIR_FUR_FINE_DETAIL_PRECISION_V6" vite.hair-fur-precision-v3.config.js
          grep -q "gapFactor = gapSpan >= 8" vite.hair-fur-precision-v3.config.js
          grep -q "ADAPTIVE_ALPHA_EDGE_SMOOTHING_V4" vite.hybrid-edge-refine.config.js
          grep -q "smoothing = 0.50" vite.hybrid-edge-refine.config.js
      - run: npm ci
      - run: npm run build
      - name: Restore generated build artifacts
        run: |
          git restore --source=HEAD --worktree --staged public/og 2>/dev/null || true
          git clean -fd public/og || true
      - name: Guard final diff after build
        run: |
          git diff --check
          changed="$(git diff --name-only origin/main | sort | tr '\n' ' ')"
          test "$changed" = "vite.hair-fur-precision-v3.config.js vite.hybrid-edge-refine.config.js "
      - name: Commit verified edge and hair change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.hair-fur-precision-v3.config.js vite.hybrid-edge-refine.config.js
          git commit -m "Refine edges and longer hair gaps [skip ci]"
          git push origin HEAD
