name: Wrap final settings tags as chips

on:
  push:
    paths:
      - '.github/workflows/final-tags-wrap-chips.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render final tags as wrapping chips
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          old = """                  ? (
                    <span className=\"block text-[14px] sm:text-[14.5px] whitespace-normal leading-[1.65] [word-break:keep-all] [overflow-wrap:break-word]\">
                      {activeTagList.join(' · ')}
                    </span>
                  )"""

          new = """                  ? (
                    <div className=\"flex w-full min-w-0 flex-wrap items-start gap-1.5 overflow-visible\">
                      {activeTagList.map((tag, index) => (
                        <span
                          key={`${tag}-${index}`}
                          className=\"inline-flex max-w-full items-center rounded-md border border-[#E8D7A6] bg-white px-2 py-1 text-[13.5px] sm:text-[14px] font-bold leading-snug text-[#4F4638] whitespace-normal [word-break:keep-all] [overflow-wrap:anywhere]\"
                        >
                          {tag}
                        </span>
                      ))}
                    </div>
                  )"""

          if old not in text:
              raise SystemExit('Current final tag text block not found.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('Final settings tags now wrap as visible chips without horizontal scrolling.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git commit -m "Show all final tags without scrolling"
          git push
