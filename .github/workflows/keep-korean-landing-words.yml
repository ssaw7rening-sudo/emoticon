name: Keep Korean Landing Words

on:
  push:
    paths:
      - '.github/workflows/keep-korean-landing-words.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Keep Korean words together
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/BackgroundRemoverLanding.jsx')
          s = p.read_text(encoding='utf-8')
          old = '<div className="min-h-screen bg-[#FFFDF8] text-[#35312C]">'
          new = '<div className="min-h-screen bg-[#FFFDF8] text-[#35312C]" style={lang === \'ko\' ? { wordBreak: \'keep-all\', overflowWrap: \'break-word\' } : undefined}>'
          if old not in s:
              raise SystemExit('Landing wrapper not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BackgroundRemoverLanding.jsx
          git commit -m 'Keep Korean landing words from splitting'
          git push
