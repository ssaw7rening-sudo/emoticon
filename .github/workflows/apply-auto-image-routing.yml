name: Apply Auto Image Routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-auto-image-routing.yml'

permissions:
  contents: write

env:
  AUTO_ROUTING_REFACTOR_RUN: '5'

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Stabilize one-time refactor script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/refactor-auto-image-routing.mjs')
          s = p.read_text()

          fixes = [
              (
                  "      setSplitError(`${t.splitFailed} [원인: ${e?.message || String(e)}]`);",
                  "      setSplitError(t.splitFailed + ' [원인: ' + (e?.message || String(e)) + ']');"
              ),
              (
                  "const precisionEnd = code.indexOf('  const downloadBlob = (blob, filename) => {', precisionStart);",
                  "const precisionStartCurrent = code.indexOf('  const runPrecisionRetry = async () => {');\nconst precisionEnd = code.indexOf('  const downloadBlob = (blob, filename) => {', precisionStartCurrent);"
              ),
              (
                  "code = code.slice(0, precisionStart) + newPrecision + code.slice(precisionEnd);",
                  "code = code.slice(0, precisionStartCurrent) + newPrecision + code.slice(precisionEnd);"
              ),
              (
                  "const effectStart = code.indexOf('  useEffect(() => {\\n    if (\\n      sheetDetection.status', autoRef);",
                  "const autoRefCurrent = code.indexOf('  autoSplitCallbackRef.current = autoSplit;', autoStart);\nconst effectStart = code.indexOf('  useEffect(() => {\\n    if (\\n      sheetDetection.status', autoRefCurrent);"
              ),
          ]

          for old, new in fixes:
              if old not in s:
                  raise SystemExit('refactor fix anchor not found: ' + old[:90])
              s = s.replace(old, new)

          p.write_text(s)
          PY
      - run: node scripts/refactor-auto-image-routing.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit refactored source and remove one-time tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BackgroundRemover.jsx
          git rm -f scripts/refactor-auto-image-routing.mjs .github/workflows/apply-auto-image-routing.yml
          git commit -m "Refactor image handling into automatic sheet and photo routes"
          git push
