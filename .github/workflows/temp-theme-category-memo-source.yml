name: Temporary Theme Category Memo Source Migration

on:
  push:
    branches:
      - cleanup/theme-category-keys-memo-source

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/theme-category-keys-memo-source
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Patch theme and category key memoization into source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          vite_path = Path('vite.tailwind-motion-cleanup.config.js')

          app = app_path.read_text()
          app_anchor = "  const themeKeys = Object.keys(currentThemes);\n  const categoryKeys = Object.keys(currentTags);"
          app_replacement = "  const themeKeys = React.useMemo(() => Object.keys(currentThemes), [currentThemes]);\n  const categoryKeys = React.useMemo(() => Object.keys(currentTags), [currentTags]);"
          app_count = app.count(app_anchor)
          print(f'app key anchor count={app_count}')
          if app_count != 1:
              raise SystemExit(f'Expected exactly one App key anchor, found {app_count}')
          app = app.replace(app_anchor, app_replacement)
          if app.count('const themeKeys = React.useMemo(() => Object.keys(currentThemes), [currentThemes]);') != 1:
              raise SystemExit('themeKeys memoized source line was not written exactly once')
          if app.count('const categoryKeys = React.useMemo(() => Object.keys(currentTags), [currentTags]);') != 1:
              raise SystemExit('categoryKeys memoized source line was not written exactly once')
          app_path.write_text(app)

          vite = vite_path.read_text()
          vite_block = '''      // Keep derived key arrays stable while the selected language dictionaries
      // are unchanged. This also makes the sorted theme memo effective.
      const keyAnchor = "  const themeKeys = Object.keys(currentThemes);\\n  const categoryKeys = Object.keys(currentTags);"
      if (!transformed.includes(keyAnchor)) {
        throw new Error('[sort-memoization] theme/category key anchor was not found')
      }
      transformed = transformed.replace(
        keyAnchor,
        "  const themeKeys = React.useMemo(() => Object.keys(currentThemes), [currentThemes]);\\n  const categoryKeys = React.useMemo(() => Object.keys(currentTags), [currentTags]);"
      )

'''
          vite_count = vite.count(vite_block)
          print(f'vite key transform block count={vite_count}')
          if vite_count != 1:
              raise SystemExit(f'Expected exactly one Vite key transform block, found {vite_count}')
          vite = vite.replace(vite_block, '')
          vite_path.write_text(vite)
          PY
      - name: Verify intended diff only
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/App.jsx vite.tailwind-motion-cleanup.config.js "
          test "$(grep -F -c 'const themeKeys = React.useMemo(() => Object.keys(currentThemes), [currentThemes]);' src/App.jsx)" = "1"
          test "$(grep -F -c 'const categoryKeys = React.useMemo(() => Object.keys(currentTags), [currentTags]);' src/App.jsx)" = "1"
          ! grep -Fq 'const themeKeys = Object.keys(currentThemes);' src/App.jsx
          ! grep -Fq 'const categoryKeys = Object.keys(currentTags);' src/App.jsx
          ! grep -Fq 'const keyAnchor =' vite.tailwind-motion-cleanup.config.js
          ! grep -Fq '[sort-memoization] theme/category key anchor was not found' vite.tailwind-motion-cleanup.config.js
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source migration
        shell: bash
        run: |
          rm .github/workflows/temp-theme-category-memo-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx vite.tailwind-motion-cleanup.config.js .github/workflows/temp-theme-category-memo-source.yml
          git commit -m "Move theme/category key memoization into source [skip ci]"
          git push origin HEAD:cleanup/theme-category-keys-memo-source
