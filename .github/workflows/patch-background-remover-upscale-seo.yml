name: Patch Background Remover Upscale SEO

on:
  push:
    paths:
      - '.github/workflows/patch-background-remover-upscale-seo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch landing and SEO copy
        run: python scripts/patch-background-remover-upscale-seo.py
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BackgroundRemoverLanding.jsx scripts/generate-localized-pages.mjs src/App.jsx
          git commit -m 'Add upscale messaging to background remover landing'
          git push
# retry with current landing structure
