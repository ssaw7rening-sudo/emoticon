name: Compact Emoticon Cards

on:
  push:
    paths:
      - '.github/workflows/compact-emoticon-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compact preview cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/EmoticonPostProcessor.jsx')
          text = path.read_text(encoding='utf-8')

          replacements = {
            "normalized: '360×360 완료', raw: '자동 분리'": "normalized: '360', raw: '자동'",
            "normalized: '360×360 ready', raw: 'Auto split'": "normalized: '360', raw: 'Auto'",
            "normalized: '360×360完了', raw: '自動分割'": "normalized: '360', raw: '自動'",
            "normalized: '360×360完成', raw: '自动分割'": "normalized: '360', raw: '自动'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing copy block: {old}')
              text = text.replace(old, new, 1)

          old = '''              <span className="absolute left-1.5 top-1.5 flex h-6 min-w-6 items-center justify-center rounded-full bg-black/65 px-1.5 text-[10px] font-extrabold text-white">{item.index}</span>
              <span className="absolute bottom-1.5 right-1.5 rounded-full bg-white/90 px-1.5 py-0.5 text-[8px] font-extrabold text-[#61705D] shadow-sm">{item.finalBlob ? t.normalized : t.raw}</span>
            </div>
            <div className="grid grid-cols-2 border-t border-[#EEEAE3]">
              <button type="button" onClick={() => openEditor(item)} className="border-r border-[#EEEAE3] px-1 py-2 text-[10px] font-extrabold text-[#6A5A46] hover:bg-[#FFF9F0]">✏️ {t.edit}</button>
              <button type="button" onClick={() => downloadItem(item)} className="px-1 py-2 text-[10px] font-extrabold text-[#4E664A] hover:bg-[#F8FBF6]">↓ {t.save}</button>
            </div>'''

          new = '''              <span className="absolute left-1 top-1 flex h-5 min-w-5 items-center justify-center rounded-md bg-black/55 px-1 text-[9px] font-extrabold leading-none text-white shadow-sm">{String(item.index).padStart(2, '0')}</span>
              <span className="absolute right-1 top-1 rounded-md bg-white/88 px-1.5 py-0.5 text-[8px] font-extrabold leading-none text-[#5B6E56] shadow-sm backdrop-blur-[1px]">✓ {item.finalBlob ? t.normalized : t.raw}</span>
            </div>
            <div className="grid grid-cols-2 border-t border-[#EEEAE3] bg-white">
              <button type="button" onClick={() => openEditor(item)} className="whitespace-nowrap border-r border-[#EEEAE3] px-1 py-1.5 text-[9px] font-extrabold leading-5 text-[#6A5A46] hover:bg-[#FFF9F0] sm:text-[10px]">✏️ {t.edit}</button>
              <button type="button" onClick={() => downloadItem(item)} className="whitespace-nowrap px-1 py-1.5 text-[9px] font-extrabold leading-5 text-[#4E664A] hover:bg-[#F8FBF6] sm:text-[10px]">↓ {t.save}</button>
            </div>'''

          if old not in text:
              raise SystemExit('Preview card block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/EmoticonPostProcessor.jsx
          git commit -m 'Compact emoticon preview card controls'
          git push
