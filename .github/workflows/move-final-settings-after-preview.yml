name: Move final settings after preview

on:
  push:
    paths:
      - '.github/workflows/move-final-settings-after-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Move final settings below prompt preview
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          preview_marker = '          {/* Final settings checkpoint inside prompt preview */}'
          preview_end_marker = "          {previewMode === 'gpt' && ("
          action_hub_marker = '        <section id="ai-action-hub" className="flex flex-col gap-3 mt-2 pb-4">\n'
          final_marker = '          {/* Final settings checkpoint after prompt preview */}'

          if final_marker in text:
              print('Final settings already placed after preview; skipping.')
          else:
              if preview_marker not in text:
                  raise SystemExit('Preview settings card not found.')
              start = text.index(preview_marker)
              end = text.index(preview_end_marker, start)
              block = text[start:end]
              block = block.replace(preview_marker, final_marker, 1)
              text = text[:start] + text[end:]

              insert_at = text.index(action_hub_marker) + len(action_hub_marker)
              text = text[:insert_at] + block + text[insert_at:]
              path.write_text(text, encoding='utf-8')
              print('Moved final settings below prompt preview and before action controls.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Place final settings below prompt preview"
          git push
