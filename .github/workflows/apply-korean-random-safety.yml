name: Apply Korean Random Phrase Safety

on:
  push:
    paths:
      - '.github/workflows/apply-korean-random-safety.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Korean random phrase selection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          source = path.read_text(encoding='utf-8')

          old = """  const shuffleEmoticons = () => {
    const ALL_PHRASES = Array.from(new Set(Object.values(currentThemes).flat()));
    const shuffled = [...ALL_PHRASES].sort(() => 0.5 - Math.random());
    setEmoticons(shuffled.slice(0, 15));
    setActiveTheme('custom');
  };"""

          new = """  const getKoreanRandomRenderRisk = (phrase) => {
    if (lang !== 'ko') return 0;

    let risk = 0;
    let hangulCount = 0;
    const complexFinals = new Set([3, 5, 6, 9, 10, 11, 12, 13, 14, 15, 18]);

    for (const char of phrase) {
      const syllable = char.charCodeAt(0) - 0xAC00;
      if (syllable < 0 || syllable > 11171) continue;

      hangulCount += 1;
      const finalConsonant = syllable % 28;
      const vowel = Math.floor(syllable / 28) % 21;

      // 받침 ㅌ은 이미지 생성에서 ㄹ 등으로 오인될 가능성이 높아 랜덤 후보에서 사실상 제외합니다.
      if (finalConsonant === 25) risk += 100;

      // 겹받침은 작은 이모티콘 글자에서 획이 뭉개질 가능성이 높아 우선순위를 낮춥니다.
      if (complexFinals.has(finalConsonant)) risk += 5;

      // ㅗ/ㅜ + ㄹ 받침(올/울 계열)은 모양이 비슷하게 뭉개질 수 있어 강하게 감점합니다.
      if (finalConsonant === 8 && (vowel === 8 || vowel === 13)) risk += 3;
      else if (vowel === 8 || vowel === 13) risk += 0.2;
    }

    // 긴 문구는 작은 시트에서 글자 정확도가 떨어지므로 조금씩 감점합니다.
    if (hangulCount > 6) risk += (hangulCount - 6) * 0.5;

    return risk;
  };

  const shuffleEmoticons = () => {
    const ALL_PHRASES = Array.from(new Set(Object.values(currentThemes).flat()));

    const shuffled = lang === 'ko'
      ? ALL_PHRASES
          .map((phrase) => {
            const risk = getKoreanRandomRenderRisk(phrase);
            const weight = risk >= 100 ? 0 : risk >= 5 ? 0.15 : risk >= 3 ? 0.35 : risk >= 1 ? 0.65 : 1;
            return {
              phrase,
              randomKey: weight === 0 ? -1 : Math.pow(Math.random(), 1 / weight),
            };
          })
          .sort((a, b) => b.randomKey - a.randomKey)
          .map(({ phrase }) => phrase)
      : [...ALL_PHRASES].sort(() => 0.5 - Math.random());

    setEmoticons(shuffled.slice(0, 15));
    setActiveTheme('custom');
  };"""

          if old not in source:
              raise SystemExit('Target shuffleEmoticons block was not found; no changes made.')

          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Improve Korean random phrase rendering safety"
          git push
