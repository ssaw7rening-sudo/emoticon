name: Fix Footer Font

on:
  push:
    paths:
      - '.github/workflows/fix-footer-font.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Unify footer copyright font
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          s = app.read_text(encoding='utf-8')
          old = 'className="text-[13.5px] text-[#8C7A6B] font-bold mt-1"'
          new = 'className="footer-copyright text-[13.5px] text-[#8C7A6B] font-bold mt-1"'
          if old not in s:
              raise SystemExit('Footer copyright class anchor not found')
          s = s.replace(old, new, 1)
          app.write_text(s, encoding='utf-8')

          css = Path('src/index.css')
          c = css.read_text(encoding='utf-8')
          marker = ".lang-zh header,\n.lang-zh header *,\n.lang-zh .brand-logo {\n  font-family: 'Paperlogy', -apple-system, BlinkMacSystemFont, sans-serif !important;\n}\n"
          addition = marker + "\n/* Keep the copyright signature visually identical in every language. */\n.footer-copyright,\n.lang-zh .footer-copyright,\n.lang-zh .footer-copyright * {\n  font-family: 'Paperlogy', -apple-system, BlinkMacSystemFont, sans-serif !important;\n}\n"
          if marker not in c:
              raise SystemExit('Chinese font override marker not found')
          if '.footer-copyright,' not in c:
              c = c.replace(marker, addition, 1)
          css.write_text(c, encoding='utf-8')
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/index.css
          git commit -m 'Unify footer copyright font across languages'
          git push
