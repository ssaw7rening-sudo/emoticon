name: Safe Component Owner

on:
  push:
    branches: [fix/component-owner-safe-fallback]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply safe component ownership patch
        run: node .github/scripts/patch-safe-component-owner.mjs
      - name: Remove temporary patch files
        run: rm .github/scripts/patch-safe-component-owner.mjs .github/workflows/safe-component-owner.yml
      - name: Guard final diff
        run: |
          git diff --check
          changed="$(git diff --name-only origin/main | sort)"
          test "$changed" = "vite.precise-sticker-split.config.js"
          grep -q "precise-sticker-sheet-split-v9-safe-component-fallback" vite.precise-sticker-split.config.js
          grep -q "const legacyGroupBounds = groupBounds.map" vite.precise-sticker-split.config.js
          grep -q "const safeCandidateGroup = new Uint8Array(15)" vite.precise-sticker-split.config.js
          grep -q "const finalComponentOwner = new Int16Array" vite.precise-sticker-split.config.js
          grep -q "candidate.count < legacy.count \* 0.82" vite.precise-sticker-split.config.js
      - run: npm ci
      - run: npm run build
      - name: Commit verified splitter change
        run: |
          git clean -fd public/og || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.precise-sticker-split.config.js
          git commit -m "Add safe component ownership fallback [skip ci]"
          git push origin HEAD
