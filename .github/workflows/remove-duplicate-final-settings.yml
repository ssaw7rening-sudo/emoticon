name: Remove duplicate final settings

on:
  push:
    paths:
      - '.github/workflows/remove-duplicate-final-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove duplicate launch summary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          start_marker = '            {/* Final settings checkpoint before AI launch */}'
          end_marker = '            {/* 1. Launch Info Header */}'

          if start_marker not in text:
              print('Duplicate launch summary already removed.')
          else:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]
              path.write_text(text, encoding='utf-8')
              print('Removed duplicate final settings card before AI launch.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Remove duplicate final settings card"
          git push
