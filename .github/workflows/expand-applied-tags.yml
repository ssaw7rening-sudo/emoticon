name: Expand applied tags

on:
  push:
    paths:
      - '.github/workflows/expand-applied-tags.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove applied tag scroll limit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          old = 'className="flex flex-wrap gap-1.5 max-h-[80px] overflow-y-auto no-scrollbar"'
          new = 'className="flex flex-wrap gap-1.5 overflow-visible"'
          count = text.count(old)
          if count == 0:
              raise SystemExit('Applied tag scroll container not found.')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          print(f'Expanded {count} applied-tag container(s).')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git commit -m "Expand applied tags without scrolling"
          git push
