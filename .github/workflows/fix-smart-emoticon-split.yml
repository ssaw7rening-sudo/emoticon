name: Fix Smart Split Localized Badges

on:
  push:
    paths:
      - '.github/workflows/fix-smart-emoticon-split.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fix localized badges
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/BackgroundRemover.jsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace("splitTitle: '15個の絵文字を自動分割', splitBadge: '智能检测'", "splitTitle: '15個の絵文字を自動分割', splitBadge: 'スマート検出'", 1)
          text = text.replace("splitTitle: '自动分割15个表情', splitBadge: '5列 × 3行'", "splitTitle: '自动分割15个表情', splitBadge: '智能检测'", 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BackgroundRemover.jsx
          git commit -m 'Fix smart split localized badges'
          git push
