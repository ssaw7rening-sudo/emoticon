name: Apply Emoticon Finishing

on:
  push:
    paths:
      - '.github/workflows/apply-emoticon-finishing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Patch background remover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/BackgroundRemover.jsx')
          text = path.read_text(encoding='utf-8')

          old_import = "import React, { useEffect, useRef, useState } from 'react';"
          new_import = old_import + "\nimport EmoticonPostProcessor from './EmoticonPostProcessor';"
          if "EmoticonPostProcessor" not in text:
              text = text.replace(old_import, new_import, 1)

          replacements = [
              ("compareHint: '가운데 슬라이더를 좌우로 움직여 원본과 결과를 비교하세요.',", "compareHint: '가운데 슬라이더를 좌우로 움직여 원본과 결과를 비교하세요.',\n    transparentAlready: '이미 투명 배경인 PNG는 배경 제거 대상이 아닙니다. 배경이 있는 PNG·JPG·WEBP 이미지를 사용해 주세요.',"),
              ("compareHint: 'Drag the center slider left or right to compare the original and result.',", "compareHint: 'Drag the center slider left or right to compare the original and result.',\n    transparentAlready: 'A PNG that already has transparency does not need background removal. Please use a PNG, JPG, or WEBP with a background.',"),
              ("compareHint: '中央のスライダーを左右に動かして元画像と結果を比較できます。',", "compareHint: '中央のスライダーを左右に動かして元画像と結果を比較できます。',\n    transparentAlready: 'すでに透過背景のPNGは背景削除の対象ではありません。背景のあるPNG・JPG・WEBPをご利用ください。',"),
              ("compareHint: '左右拖动中间滑块即可对比原图和处理结果。',", "compareHint: '左右拖动中间滑块即可对比原图和处理结果。',\n    transparentAlready: '已经带透明背景的PNG无需再次移除背景。请使用带背景的PNG、JPG或WEBP图片。',")
          ]
          for old, new in replacements:
              if old in text and 'transparentAlready' not in text[text.find(old):text.find(old)+300]:
                  text = text.replace(old, new, 1)

          marker = "export default function BackgroundRemover({ lang = 'ko' }) {"
          helper = """async function hasRealTransparency(file) {
            if (file?.type !== 'image/png') return false;
            const { canvas, ctx } = await drawFileToCanvas(file);
            const { width, height } = canvas;
            if (!width || !height) return false;
            const pixels = ctx.getImageData(0, 0, width, height).data;
            const step = Math.max(1, Math.floor(Math.sqrt((width * height) / 300000)));
            for (let y = 0; y < height; y += step) {
              for (let x = 0; x < width; x += step) {
                if (pixels[(y * width + x) * 4 + 3] < 250) return true;
              }
            }
            return false;
          }

          """
          if 'async function hasRealTransparency' not in text:
              text = text.replace(marker, helper + marker, 1)

          old_select = "const selectFile = (nextFile) => {"
          if old_select in text:
              text = text.replace(old_select, "const selectFile = async (nextFile) => {", 1)

          size_block = """    if (nextFile.size > 12 * 1024 * 1024) {
              setError(t.tooLarge);
              return;
            }
          """
          transparent_block = size_block + """    if (nextFile.type === 'image/png') {
              try {
                if (await hasRealTransparency(nextFile)) {
                  setError(t.transparentAlready);
                  return;
                }
              } catch (e) {
                console.warn('Transparent PNG detection failed:', e);
              }
            }
          """
          if "setError(t.transparentAlready)" not in text:
              if size_block not in text:
                  raise SystemExit('Could not find file-size validation block')
              text = text.replace(size_block, transparent_block, 1)

          start_marker = '                  <div className="mt-3 grid grid-cols-3 gap-2 sm:grid-cols-5 sm:gap-2.5">'
          if start_marker in text:
              start = text.index(start_marker)
              end_marker = '                </>\n              )}'
              end = text.index(end_marker, start)
              replacement = """                  <EmoticonPostProcessor
                    items={splitItems}
                    sourceName={file?.name || 'emoticon'}
                    lang={lang}
                  />
"""
              text = text[:start] + replacement + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add ZIP dependency
        run: npm install jszip@3.10.1 --save

      - name: Build
        run: npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BackgroundRemover.jsx package.json package-lock.json
          git commit -m 'Add emoticon editing 360 export and ZIP'
          git push
