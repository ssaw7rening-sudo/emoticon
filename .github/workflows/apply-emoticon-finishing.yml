name: Apply Emoticon Finishing

on:
  push:
    paths:
      - '.github/workflows/apply-emoticon-finishing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Patch background remover
        run: node scripts/patch-emoticon-finishing.mjs

      - name: Add ZIP dependency
        run: npm install jszip@3.10.1 --save

      - name: Build
        run: npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BackgroundRemover.jsx package.json package-lock.json
          git commit -m 'Add emoticon editing 360 export and ZIP'
          git push
