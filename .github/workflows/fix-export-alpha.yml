name: Fix Export Alpha

on:
  push:
    paths:
      - '.github/workflows/fix-export-alpha.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python scripts/fix-export-alpha.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/EmoticonPostProcessor.jsx
          git rm -f scripts/fix-export-alpha.py
          git rm -f .github/workflows/fix-export-alpha.yml
          git commit -m "Preserve preview alpha in PNG and ZIP exports"
          git push
