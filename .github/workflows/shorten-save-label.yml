name: Shorten Save Label

on:
  push:
    paths:
      - '.github/workflows/shorten-save-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Shorten save labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/EmoticonPostProcessor.jsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "save: 'PNG 저장'": "save: '저장'",
              "save: 'Save PNG'": "save: 'Save'",
              "save: 'PNG保存'": "save: '保存'",
              "save: '保存PNG'": "save: '保存'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing label: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/EmoticonPostProcessor.jsx
          git commit -m 'Shorten emoticon save labels'
          git push
