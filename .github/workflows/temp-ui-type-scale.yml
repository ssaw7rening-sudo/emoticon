name: Temporary UI Type Scale

on:
  push:
    branches:
      - ui/type-scale-theme-harmony

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui/type-scale-theme-harmony
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply and verify typography balance
        run: node scripts/temp-ui-type-scale.mjs
