name: Update model background modes

on:
  push:
    paths:
      - '.github/workflows/update-model-background-modes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update Gemini and Grok background behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ("geminiTransparent: '투명 배경'", "geminiTransparent: '누끼용 흰 배경'"),
              ("geminiTransparent: 'Transparent'", "geminiTransparent: 'White BG for removal'"),
              ("geminiTransparent: '透過背景'", "geminiTransparent: '切り抜き用白背景'"),
              ("geminiTransparent: '透明背景'", "geminiTransparent: '抠图用白背景'"),
              ("grokTransparent: '투명 배경'", "grokTransparent: '투명 PNG(배경 제거)'"),
              ("grokTransparent: 'Transparent'", "grokTransparent: 'Transparent PNG (BG removal)'"),
              ("grokTransparent: '透過背景'", "grokTransparent: '透過PNG（背景削除）'"),
              ("grokTransparent: '透明背景'", "grokTransparent: '透明PNG（移除背景）'"),
              ("geminiWorkflowTip: 'Gemini 팁: 시트 전체는 캐릭터와 구도 초안용으로 사용하고, 최종 이미지는 15종 개별 분할로 한 장씩 만드는 것을 권장합니다.'", "geminiWorkflowTip: 'Gemini 팁: 알파 투명 배경을 직접 지원하지 않습니다. 투명 PNG가 필요하면 [누끼용 흰 배경] 또는 [크로마키]로 생성한 뒤 배경을 제거하세요. 시트 전체는 초안용, 최종 이미지는 15종 개별 분할을 권장합니다.'"),
              ("geminiWorkflowTip: 'Gemini tip: Use the full sheet as a character and layout draft, then generate final images one at a time with Batch Split.'", "geminiWorkflowTip: 'Gemini tip: Native alpha transparency is not supported. For a transparent PNG, generate with [White BG for removal] or [Chroma key], then remove the background. Use the full sheet as a draft and Batch Split for finals.'"),
              ("geminiWorkflowTip: 'Geminiヒント: シート全体は構図の試作として使い、最終画像は15종個別分割で1枚ずつ生成することをおすすめします。'", "geminiWorkflowTip: 'Geminiヒント: アルファ透過背景は直接生成できません。透過PNGが必要な場合は[切り抜き用白背景]または[クロマキー]で生成後、背景を削除してください。最終画像は個別分割を推奨します。'"),
              ("geminiWorkflowTip: 'Gemini提示：建议将整页作为构图草稿，最终成品使用单张拆分模式逐一生成。'", "geminiWorkflowTip: 'Gemini提示：不直接支持Alpha透明背景。需要透明PNG时，请使用[抠图用白背景]或[绿幕抠图]生成后再移除背景；最终成品建议逐张拆分生成。'"),
              ("grokWorkflowTip: 'Grok 팁: Grok은 Flux.1 엔진 기반으로 고화질 스티커 렌더링에 우수합니다. 글자 수정이 필요할 경우 [글자 미포함] 모드로 생성해 보세요.'", "grokWorkflowTip: 'Grok 팁: Imagine Image 2.0은 배경 제거 후 투명 배경 내보내기를 지원합니다. 투명 PNG가 필요하면 [투명 PNG(배경 제거)] 모드를 사용하세요. 글자 정확도가 중요하면 [글자 없이]도 권장합니다.'"),
              ("grokWorkflowTip: 'Grok tip: Grok powered by Flux.1 excels at sticker renders. If text stutters, switch to [Text-Free] mode and overlay text later.'", "grokWorkflowTip: 'Grok tip: Imagine Image 2.0 supports background removal and transparent export. Use [Transparent PNG (BG removal)] when you need alpha transparency. For exact lettering, [No text] is still safer.'"),
              ("grokWorkflowTip: 'Grokヒント: GrokはFlux.1エンジンを搭載し、自然なテキストとステッカーの質感を正確に表現します。'", "grokWorkflowTip: 'Grokヒント: Imagine Image 2.0は背景削除と透過書き出しに対応しています。透過PNGが必要な場合は[透過PNG（背景削除）]を使用してください。文字精度を優先する場合は[文字なし]も推奨します。'"),
              ("grokWorkflowTip: 'Grok提示：Grok基于Flux.1引擎，擅长精准的自然语言指令与矢量贴纸质感。'", "grokWorkflowTip: 'Grok提示：Imagine Image 2.0支持背景移除并导出透明背景。需要透明PNG时请使用[透明PNG（移除背景）]；文字准确性优先时建议使用[纯图无字]。'"),
              ("transparent: 'Clean solid white background with a subtle crisp sticker die-cut white outline. Pure solid white (#FFFFFF).',", "transparent: 'Create each sticker as a fully isolated subject with a clean, well-separated silhouette. After generation, use Grok Imagine Image 2.0 Background Removal to remove the background and export a PNG with genuine alpha transparency. Do not draw checkerboard tiles or fake transparency. If background removal cannot be applied automatically, use a pure solid white (#FFFFFF) background as the fallback for easy removal.',"),
              ("transparent: 'Clean solid pure white background with a crisp white sticker die-cut outline around each character. Absolutely DO NOT draw any gray-and-white checkerboard pattern, transparency grid tiles, or fake PNG checkerboard texture.',", "transparent: 'Clean solid pure white (#FFFFFF) background intended for later background removal. Keep each sticker fully isolated with a clear continuous silhouette and no background objects, cast shadows, haze, or transparency checkerboard. Do not fake alpha transparency; this output is a removal-ready white-background source image.',"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source string not found: {old[:100]}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          print('Updated Gemini/Grok background labels, tips, and prompt instructions.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git commit -m "Align Gemini and Grok background modes"
          git push
