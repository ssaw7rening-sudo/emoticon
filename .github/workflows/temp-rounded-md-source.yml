name: Temporary Rounded MD Source Cleanup

on:
  push:
    branches:
      - cleanup/rounded-md-source

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/rounded-md-source
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Patch source and remove dead transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          vite_path = Path('vite.tailwind-motion-cleanup.config.js')

          app = app_path.read_text()
          target = 'rounded-md md:rounded-md'
          count = app.count(target)
          if count != 12:
              raise SystemExit(f'Expected 12 rounded-md duplicates, found {count}')
          app = app.replace(target, 'rounded-md')
          if target in app:
              raise SystemExit('rounded-md duplicate remained after replacement')
          app_path.write_text(app)

          vite = vite_path.read_text()
          block = """      // Remove the remaining no-op responsive duplicate. This responsive utility\n      // resolves to the same value as its base utility and therefore changes no rendering.\n      transformed = transformed.replace(/\\brounded-md md:rounded-md\\b/g, 'rounded-md')\n\n"""
          if vite.count(block) != 1:
              raise SystemExit(f'Expected one Vite rounded-md cleanup block, found {vite.count(block)}')
          vite = vite.replace(block, '')
          vite_path.write_text(vite)
          PY
      - name: Verify intended diff only
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/App.jsx vite.tailwind-motion-cleanup.config.js "
          test "$(grep -o 'rounded-md md:rounded-md' src/App.jsx | wc -l)" -eq 0
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source cleanup
        shell: bash
        run: |
          rm .github/workflows/temp-rounded-md-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx vite.tailwind-motion-cleanup.config.js .github/workflows/temp-rounded-md-source.yml
          git commit -m "Move rounded-md cleanup into source [skip ci]"
          git push origin HEAD:cleanup/rounded-md-source
