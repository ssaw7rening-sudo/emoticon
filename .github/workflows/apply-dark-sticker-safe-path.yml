name: Apply dark sticker safe path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dark-sticker-safe-path.yml'
      - '.github/scripts/apply_dark_sticker_safe_path.py'

permissions:
  contents: write

concurrency:
  group: apply-dark-sticker-safe-path-main
  cancel-in-progress: true

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dark sticker safe path
        run: python .github/scripts/apply_dark_sticker_safe_path.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Validate production build
        run: npm run build

      - name: Commit safe-path update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-dark-sticker-safe-path.yml .github/scripts/apply_dark_sticker_safe_path.py
          git add src/components/BackgroundRemover.jsx vite.tailwind-motion-cleanup.config.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Protect pale stickers on dark backgrounds"
          git push origin HEAD:main
