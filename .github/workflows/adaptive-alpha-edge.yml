name: Adaptive Alpha Edge

on:
  push:
    branches: [improve/alpha-edge-smoothing]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply adaptive alpha edge patch
        run: node .github/scripts/patch-adaptive-alpha-edge.mjs
      - name: Remove temporary patch files
        run: rm .github/scripts/patch-adaptive-alpha-edge.mjs .github/workflows/adaptive-alpha-edge.yml
      - name: Guard final diff
        run: |
          git diff --check
          changed="$(git diff --name-only origin/main | sort)"
          test "$changed" = "vite.hybrid-edge-refine.config.js"
          grep -q "ADAPTIVE_ALPHA_EDGE_SMOOTHING_V2" vite.hybrid-edge-refine.config.js
          grep -q "opaqueSupport < 2" vite.hybrid-edge-refine.config.js
          grep -q "Math.min(42, softened)" vite.hybrid-edge-refine.config.js
          grep -q "const maxDelta = strandLike ? 18 : 34" vite.hybrid-edge-refine.config.js
      - run: npm ci
      - run: npm run build
      - name: Commit verified edge change
        run: |
          git clean -fd public/og || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.hybrid-edge-refine.config.js
          git commit -m "Smooth cutout alpha edges adaptively [skip ci]"
          git push origin HEAD
