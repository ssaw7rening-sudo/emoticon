name: Temporary Defer Background Tools

on:
  push:
    branches:
      - perf/defer-background-tools

permissions:
  contents: write

jobs:
  optimize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/defer-background-tools
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build baseline
        run: npm run build
      - name: Capture baseline entry size
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const match = html.match(/<script[^>]+type=["']module["'][^>]+src=["']([^"']+)["']/i) || html.match(/<script[^>]+src=["']([^"']+)["'][^>]+type=["']module["']/i);
          if (!match) throw new Error('Could not locate entry module in dist/index.html');
          const rel = match[1].replace(/^\//, '');
          const file = `dist/${rel}`;
          const size = fs.statSync(file).size;
          fs.writeFileSync('/tmp/baseline-entry.json', JSON.stringify({ file, size }));
          console.log('BASELINE_ENTRY', JSON.stringify({ file, size }));
          NODE
      - name: Apply deferred background-tool loading
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          text = app_path.read_text(encoding='utf-8')

          old_imports = '''import BackgroundRemover from "./components/BackgroundRemover.jsx";\nimport BackgroundRemoverLanding from "./components/BackgroundRemoverLanding.jsx";'''
          new_imports = '''import DeferredBackgroundRemover from "./components/DeferredBackgroundRemover.jsx";\nconst BackgroundRemoverLanding = React.lazy(() => import("./components/BackgroundRemoverLanding.jsx"));'''
          if text.count(old_imports) != 1:
              raise SystemExit(f'Expected exactly one background import block, found {text.count(old_imports)}')
          text = text.replace(old_imports, new_imports, 1)

          old_route = '''if (/(^|\\/)background-remover\\/?$/.test(locationPath)) {\n  return <BackgroundRemoverLanding lang={lang} />;\n}'''
          new_route = '''if (/(^|\\/)background-remover\\/?$/.test(locationPath)) {\n  return (\n    <React.Suspense fallback={<div className="min-h-screen bg-[#FFFDF8]" />}>\n      <BackgroundRemoverLanding lang={lang} />\n    </React.Suspense>\n  );\n}'''
          if text.count(old_route) != 1:
              raise SystemExit(f'Expected exactly one background landing route, found {text.count(old_route)}')
          text = text.replace(old_route, new_route, 1)

          old_embedded = '    <BackgroundRemover lang={lang} />'
          new_embedded = '    <DeferredBackgroundRemover lang={lang} />'
          if text.count(old_embedded) != 1:
              raise SystemExit(f'Expected exactly one embedded BackgroundRemover, found {text.count(old_embedded)}')
          text = text.replace(old_embedded, new_embedded, 1)

          app_path.write_text(text, encoding='utf-8')
          PY

          cat > src/components/DeferredBackgroundRemover.jsx <<'EOF'
          import React, { useEffect, useRef, useState } from 'react';

          const BackgroundRemover = React.lazy(() => import('./BackgroundRemover.jsx'));

          export default function DeferredBackgroundRemover({ lang = 'ko' }) {
            const sentinelRef = useRef(null);
            const [shouldLoad, setShouldLoad] = useState(false);

            useEffect(() => {
              if (shouldLoad) return undefined;

              const node = sentinelRef.current;
              if (!node || typeof IntersectionObserver === 'undefined') {
                setShouldLoad(true);
                return undefined;
              }

              const observer = new IntersectionObserver((entries) => {
                if (entries.some((entry) => entry.isIntersecting)) {
                  setShouldLoad(true);
                  observer.disconnect();
                }
              }, { rootMargin: '1600px 0px' });

              observer.observe(node);
              return () => observer.disconnect();
            }, [shouldLoad]);

            return (
              <div ref={sentinelRef} data-deferred-background-remover style={{ minHeight: '1px' }}>
                {shouldLoad ? (
                  <React.Suspense fallback={null}>
                    <BackgroundRemover lang={lang} />
                  </React.Suspense>
                ) : null}
              </div>
            );
          }
          EOF

          git diff --check
      - name: Build optimized app
        run: npm run build
      - name: Verify bundle split and report savings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const baseline = JSON.parse(fs.readFileSync('/tmp/baseline-entry.json', 'utf8'));
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const match = html.match(/<script[^>]+type=["']module["'][^>]+src=["']([^"']+)["']/i) || html.match(/<script[^>]+src=["']([^"']+)["'][^>]+type=["']module["']/i);
          if (!match) throw new Error('Could not locate optimized entry module');
          const rel = match[1].replace(/^\//, '');
          const file = `dist/${rel}`;
          const size = fs.statSync(file).size;
          const savings = baseline.size - size;
          const pct = baseline.size ? (savings / baseline.size) * 100 : 0;
          const assets = fs.readdirSync('dist/assets').sort();
          const lazyAssets = assets.filter(name => /BackgroundRemover|DeferredBackground|Landing/i.test(name));
          console.log('OPTIMIZED_ENTRY', JSON.stringify({ file, size, baselineSize: baseline.size, savings, pct: Number(pct.toFixed(2)) }));
          console.log('LAZY_BACKGROUND_ASSETS', JSON.stringify(lazyAssets));
          if (savings <= 0) throw new Error(`Entry bundle did not shrink: baseline=${baseline.size}, optimized=${size}`);
          if (!assets.some(name => /BackgroundRemoverLanding/i.test(name))) throw new Error('BackgroundRemoverLanding lazy chunk was not emitted');
          if (!assets.some(name => /^BackgroundRemover-/i.test(name))) throw new Error('BackgroundRemover lazy chunk was not emitted');
          const entryText = fs.readFileSync(file, 'utf8');
          if (entryText.includes('배경 제거하기')) throw new Error('BackgroundRemover UI copy is still embedded in the initial entry chunk');
          NODE
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        shell: bash
        run: |
          nohup npx vite preview --config vite.tailwind-motion-cleanup.config.js --host 127.0.0.1 --port 4173 --strictPort >/tmp/emoticon-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "preview ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/emoticon-preview.log
          exit 1
      - name: Run deferred-load browser smoke checks
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));

            let response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            assert(response && response.ok(), 'Main page failed to load');
            await page.waitForTimeout(700);

            const sentinel = page.locator('[data-deferred-background-remover]');
            assert.equal(await sentinel.count(), 1, 'Deferred background-remover sentinel missing');
            assert.equal(await page.getByText('이미지의 배경을 지우고 투명 PNG로 저장해 보세요.').count(), 0, 'Background remover loaded before approaching its viewport');

            await sentinel.scrollIntoViewIfNeeded();
            await page.getByText('이미지의 배경을 지우고 투명 PNG로 저장해 보세요.').waitFor({ state: 'visible', timeout: 15000 });
            console.log('MAIN_DEFERRED_BACKGROUND_LOAD_SUCCESS');

            response = await page.goto('http://127.0.0.1:4173/background-remover/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            assert(response && response.ok(), 'Dedicated background-remover route failed to load');
            await page.getByText('무료 이미지 배경 제거').first().waitFor({ state: 'visible', timeout: 15000 });
            await page.getByText('이미지의 배경을 지우고 투명 PNG로 저장해 보세요.').waitFor({ state: 'visible', timeout: 15000 });
            console.log('DEDICATED_BACKGROUND_ROUTE_LAZY_LOAD_SUCCESS');

            assert.equal(pageErrors.length, 0, `Page errors: ${pageErrors.join(' | ')}`);
            await browser.close();
            console.log('DEFERRED_BACKGROUND_BROWSER_SMOKE_SUCCESS');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Commit verified optimization
        shell: bash
        run: |
          git restore package.json package-lock.json || true
          rm .github/workflows/temp-defer-background-tools.yml
          git diff --check
          CHANGED="$(git diff origin/main --name-only | sort | tr '\n' ' ')"
          test "$CHANGED" = "src/App.jsx src/components/DeferredBackgroundRemover.jsx "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/DeferredBackgroundRemover.jsx .github/workflows/temp-defer-background-tools.yml
          git commit -m "Defer background tools until needed"
          git push origin HEAD:perf/defer-background-tools
      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/emoticon-preview.log || true
