name: Temporary Lazy Legal Pages

on:
  push:
    branches:
      - perf/lazy-legal-pages

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/lazy-legal-pages
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Run legal page optimization verification
        run: node scripts/temp-lazy-legal-pages.mjs
