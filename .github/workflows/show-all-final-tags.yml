name: Show all final settings tags

on:
  push:
    paths:
      - '.github/workflows/show-all-final-tags.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show every selected tag in final settings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          tag_marker = "              <dt className=\"font-bold text-[#8A7758]\">{lang === 'ko' ? '선택 태그'"
          theme_marker = "              <dt className=\"font-bold text-[#8A7758]\">{lang === 'ko' ? '문구 테마'"
          dd_marker = '              <dd className="min-w-0 font-bold text-[#4F4638]">'

          tag_pos = text.index(tag_marker)
          dd_start = text.index(dd_marker, tag_pos)
          theme_pos = text.index(theme_marker, dd_start)

          replacement = "\n".join([
              '              <dd className="min-w-0 font-bold text-[#4F4638]">',
              '                {activeTagList.length > 0',
              '                  ? (',
              '                    <span className="block whitespace-normal leading-relaxed [word-break:keep-all] [overflow-wrap:break-word]">',
              "                      {activeTagList.join(' · ')}",
              '                    </span>',
              '                  )',
              "                  : (lang === 'ko' ? '선택된 태그 없음' : lang === 'ja' ? '選択タグなし' : lang === 'zh' ? '未选择标签' : 'No tags selected')}",
              '              </dd>',
              '',
          ]) + "\n"

          text = text[:dd_start] + replacement + text[theme_pos:]
          path.write_text(text, encoding='utf-8')
          print('Final settings now shows every selected tag without truncation.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git commit -m "Show all selected tags in final settings"
          git push
