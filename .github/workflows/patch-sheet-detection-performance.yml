name: Patch Sheet Detection Performance

on:
  push:
    paths:
      - '.github/workflows/patch-sheet-detection-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Optimize sheet detection
        run: python scripts/patch-sheet-detection-performance.py
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BackgroundRemover.jsx
          git commit -m 'Optimize emoticon sheet detection on mobile'
          git push
