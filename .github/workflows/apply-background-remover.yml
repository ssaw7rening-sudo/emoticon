name: Apply background remover

on:
  push:
    paths:
      - '.github/workflows/apply-background-remover.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch App
        run: node .github/scripts/apply-background-remover.mjs

      - name: Install background removal runtime
        run: npm install @huggingface/transformers@4.2.0 --save-exact

      - name: Build
        run: npm run build

      - name: Verify integration
        run: |
          grep -q 'BackgroundRemover' src/App.jsx
          grep -q '@huggingface/transformers' package.json
          test -f dist/index.html
          test -f dist/en/index.html
          test -f dist/ja/index.html
          test -f dist/zh/index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add local AI background removal tool"
            git push
          fi
