name: Temporary Shadow Token Source Cleanup

on:
  push:
    branches:
      - cleanup/shadow-token-source

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/shadow-token-source
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Diagnose non-space shadow token boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.jsx').read_text()
          xs = app.count('shadow-xs')
          two_xs = app.count('shadow-2xs')
          print(f'shadow-xs={xs}, shadow-2xs={two_xs}')
          if xs != 30 or two_xs != 47:
              raise SystemExit(f'Unexpected counts: shadow-xs={xs}, shadow-2xs={two_xs}')
          needle = 'shadow-xs'
          start = 0
          unusual = []
          while True:
              idx = app.find(needle, start)
              if idx < 0:
                  break
              prev = app[idx - 1] if idx > 0 else '<BOF>'
              if prev != ' ':
                  line = app.count('\n', 0, idx) + 1
                  left = max(0, idx - 80)
                  right = min(len(app), idx + len(needle) + 80)
                  context = app[left:right].replace('\n', '\\n')
                  unusual.append((line, repr(prev), context))
              start = idx + len(needle)
          print(f'unusual_count={len(unusual)}')
          for line, prev, context in unusual:
              print(f'line={line} prev={prev} context={context}')
          if len(unusual) != 1:
              raise SystemExit(f'Expected exactly one unusual shadow-xs boundary, found {len(unusual)}')
          raise SystemExit('Diagnostic complete; no source changes made')
          PY
