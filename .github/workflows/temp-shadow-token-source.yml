name: Temporary Shadow Token Source Cleanup

on:
  push:
    branches:
      - cleanup/shadow-token-source

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/shadow-token-source
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Patch invalid shadow tokens and remove dead transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          vite_path = Path('vite.tailwind-motion-cleanup.config.js')

          app = app_path.read_text()
          standalone_xs = app.count(' shadow-xs')
          standalone_two_xs = app.count(' shadow-2xs')
          drop_xs = app.count(' drop-shadow-xs')
          raw_xs = app.count('shadow-xs')
          raw_two_xs = app.count('shadow-2xs')
          print(
              f'standalone shadow-xs={standalone_xs}, '
              f'shadow-2xs={standalone_two_xs}, drop-shadow-xs={drop_xs}, '
              f'raw shadow-xs={raw_xs}, raw shadow-2xs={raw_two_xs}'
          )
          if standalone_xs != 29 or standalone_two_xs != 47 or drop_xs != 1:
              raise SystemExit(
                  'Expected standalone shadow-xs=29, shadow-2xs=47, drop-shadow-xs=1; '
                  f'found {standalone_xs}, {standalone_two_xs}, {drop_xs}'
              )
          if raw_xs != 30 or raw_two_xs != 47:
              raise SystemExit(f'Unexpected raw counts: shadow-xs={raw_xs}, shadow-2xs={raw_two_xs}')

          app = (
              app.replace(' drop-shadow-xs', '')
                 .replace(' shadow-2xs', '')
                 .replace(' shadow-xs', '')
          )
          if 'shadow-xs' in app or 'shadow-2xs' in app or 'drop-shadow-xs' in app:
              raise SystemExit('Invalid shadow token remained after replacement')
          app_path.write_text(app)

          vite = vite_path.read_text()
          block = """      // Tailwind 3.4 does not provide shadow-xs or shadow-2xs. They currently\n      // generate no CSS, so removing the tokens preserves the rendered UI while\n      // eliminating invalid utilities from the compiled App source.\n      transformed = transformed.replace(/\\bshadow-(?:2xs|xs)\\b/g, '')\n\n"""
          if vite.count(block) != 1:
              raise SystemExit(f'Expected one Vite invalid-shadow cleanup block, found {vite.count(block)}')
          vite = vite.replace(block, '')
          vite_path.write_text(vite)
          PY
      - name: Verify intended diff only
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/App.jsx vite.tailwind-motion-cleanup.config.js "
          ! grep -qE 'shadow-(2xs|xs)' src/App.jsx
          ! grep -q 'drop-shadow-xs' src/App.jsx
          ! grep -q 'shadow-(?:2xs|xs)' vite.tailwind-motion-cleanup.config.js
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source cleanup
        shell: bash
        run: |
          rm .github/workflows/temp-shadow-token-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx vite.tailwind-motion-cleanup.config.js .github/workflows/temp-shadow-token-source.yml
          git commit -m "Move invalid shadow cleanup into source [skip ci]"
          git push origin HEAD:cleanup/shadow-token-source
