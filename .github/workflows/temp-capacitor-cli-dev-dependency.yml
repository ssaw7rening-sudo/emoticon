name: Temporary Capacitor CLI Dev Dependency Migration

on:
  push:
    branches:
      - cleanup/capacitor-cli-dev-dependency

permissions:
  contents: write

jobs:
  migrate-build-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/capacitor-cli-dev-dependency
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Move Capacitor CLI to devDependencies
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          if (pkg.dependencies?.['@capacitor/cli'] !== '^8.5.0') {
            throw new Error(`Unexpected @capacitor/cli dependency value: ${pkg.dependencies?.['@capacitor/cli']}`);
          }
          if (pkg.devDependencies?.['@capacitor/cli']) {
            throw new Error('@capacitor/cli already exists in devDependencies');
          }
          delete pkg.dependencies['@capacitor/cli'];
          pkg.devDependencies = { '@capacitor/cli': '^8.5.0', ...pkg.devDependencies };
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Capture locked package versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const versions = {};
          for (const [key, value] of Object.entries(lock.packages || {})) {
            if (key.startsWith('node_modules/') && value?.version) versions[key] = value.version;
          }
          fs.writeFileSync('/tmp/versions-before.json', JSON.stringify(versions, null, 2));
          NODE
      - name: Refresh lock metadata only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify package versions stayed identical
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/versions-before.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const after = {};
          for (const [key, value] of Object.entries(lock.packages || {})) {
            if (key.startsWith('node_modules/') && value?.version) after[key] = value.version;
          }
          const beforeKeys = Object.keys(before).sort();
          const afterKeys = Object.keys(after).sort();
          if (JSON.stringify(beforeKeys) !== JSON.stringify(afterKeys)) {
            throw new Error('Installed package set changed while moving CLI to devDependencies');
          }
          const changed = beforeKeys.filter(key => before[key] !== after[key]);
          if (changed.length) {
            console.error(changed.map(key => `${key}: ${before[key]} -> ${after[key]}`).join('\n'));
            throw new Error('One or more locked package versions changed');
          }
          const root = lock.packages?.[''];
          if (root?.dependencies?.['@capacitor/cli']) throw new Error('CLI remains in lockfile root dependencies');
          if (root?.devDependencies?.['@capacitor/cli'] !== '^8.5.0') throw new Error('CLI missing from lockfile root devDependencies');
          if (lock.packages?.['node_modules/@capacitor/cli']?.version !== '8.5.0') throw new Error('Locked CLI version changed');
          if (lock.packages?.['node_modules/@capacitor/cli']?.dev !== true) throw new Error('CLI lock entry is not marked dev-only');
          console.log(`LOCK_VERSION_MAP_UNCHANGED ${beforeKeys.length} packages`);
          NODE
      - name: Verify production audit no longer includes Capacitor CLI chain
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/audit-prod.json', 'utf8'));
          const vulns = data.vulnerabilities || {};
          for (const name of ['@capacitor/cli', 'xcode', 'uuid']) {
            if (vulns[name]) throw new Error(`${name} still appears in production-only audit`);
          }
          console.log('PROD_AUDIT_METADATA', JSON.stringify(data.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(vulns)) console.log('PROD_AUDIT_REMAINING', name, v.severity);
          NODE
      - name: Verify intended diff only
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "package-lock.json package.json "
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit dependency classification cleanup
        shell: bash
        run: |
          rm .github/workflows/temp-capacitor-cli-dev-dependency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/temp-capacitor-cli-dev-dependency.yml
          git commit -m "Move Capacitor CLI to dev dependencies [skip ci]"
          git push origin HEAD:cleanup/capacitor-cli-dev-dependency
