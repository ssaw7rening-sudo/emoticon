name: Apply preview final settings

on:
  push:
    paths:
      - '.github/workflows/apply-preview-final-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Insert final settings card into prompt preview
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          guard = '          {/* Final settings checkpoint inside prompt preview */}'
          if guard in text:
              print('Preview final settings already present; skipping patch.')
          else:
              source_start_marker = '            {/* Final settings checkpoint before AI launch */}'
              source_end_marker = '            {/* 1. Launch Info Header */}'
              source_start = text.index(source_start_marker)
              source_end = text.index(source_end_marker, source_start)
              block = text[source_start:source_end]

              block = block.replace(
                  source_start_marker,
                  '            {/* Final settings checkpoint inside prompt preview */}',
                  1,
              )
              preview_block = '\n'.join(
                  line[2:] if line.startswith('  ') else line
                  for line in block.splitlines()
              ) + '\n'

              preview_title_pos = text.index('{t.previewTitle}')
              preview_anchor = "          {previewMode === 'gpt' && ("
              insert_at = text.index(preview_anchor, preview_title_pos)

              text = text[:insert_at] + preview_block + text[insert_at:]
              path.write_text(text, encoding='utf-8')
              print('Inserted final settings checkpoint into prompt preview.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Show final settings in prompt preview"
          git push
