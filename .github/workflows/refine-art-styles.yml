name: Refine art style prompts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-art-styles.yml'

permissions:
  contents: write

concurrency:
  group: refine-art-style-prompts-main
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Limit patch scan to art-style map
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/refine_art_styles.py')
          s = p.read_text(encoding='utf-8')
          needle = "text = ENTRY_RE.sub(refine_entry, text)"
          replacement = '''style_fn_start = text.index("  const getExpandedArtStyleText = (styleTag, isKo) => {")
          style_map_start = text.index("    const styleMap = {", style_fn_start)
          style_map_end = text.index("\n    const found = styleMap[styleTag];", style_map_start)
          style_block = text[style_map_start:style_map_end]
          style_block = ENTRY_RE.sub(refine_entry, style_block)
          text = text[:style_map_start] + style_block + text[style_map_end:]'''
          if needle not in s:
              raise SystemExit('Optimization target not found')
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Apply prompt refinements
        run: python .github/scripts/refine_art_styles.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Validate production build
        run: npm run build

      - name: Commit refined prompt system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-art-styles.yml .github/scripts/refine_art_styles.py
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine art style prompt engine"
          git push origin HEAD:main
