name: Refine art style prompts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-art-styles.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply prompt refinements
        run: python .github/scripts/refine_art_styles.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Validate production build
        run: npm run build

      - name: Commit refined prompt system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-art-styles.yml .github/scripts/refine_art_styles.py
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine art style prompt engine"
          git push origin HEAD:main
