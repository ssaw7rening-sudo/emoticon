name: Adaptive BiRefNet Verification

on:
  push:
    branches:
      - improve/adaptive-birefnet-webgpu

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: improve/adaptive-birefnet-webgpu
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: node .github/scripts/patch-adaptive-birefnet.mjs
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          npm ci
          npm run build
          grep -q "onnx-community/BEN2-ONNX" src/workers/ben2Worker.js
          grep -q "onnx-community/BiRefNet-ONNX" src/components/BackgroundRemover.jsx
          grep -q "full-webgpu-fp16" src/components/BackgroundRemover.jsx
          grep -q "lite-wasm-fp32" src/components/BackgroundRemover.jsx
          rm .github/workflows/temp-adaptive-birefnet.yml
          rm .github/scripts/patch-adaptive-birefnet.mjs
          git add src/components/BackgroundRemover.jsx vite.ben2-auto.config.js vite.ben2-worker.config.js .github/workflows/temp-adaptive-birefnet.yml .github/scripts/patch-adaptive-birefnet.mjs
          actual="$(git diff --cached origin/main --name-only | sort)"
          expected="$(printf '%s\n' src/components/BackgroundRemover.jsx vite.ben2-auto.config.js vite.ben2-worker.config.js | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Strengthen BiRefNet fallback with adaptive WebGPU [skip ci]'
          git push origin HEAD:improve/adaptive-birefnet-webgpu
