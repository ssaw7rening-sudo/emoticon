name: Adaptive BiRefNet Verification

on:
  push:
    branches:
      - improve/adaptive-birefnet-webgpu

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: improve/adaptive-birefnet-webgpu
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: node .github/scripts/patch-adaptive-birefnet.mjs
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          npm ci
          npm run build
          rm .github/workflows/temp-adaptive-birefnet.yml
          rm .github/scripts/patch-adaptive-birefnet.mjs
          git add src/components/BackgroundRemover.jsx .github/workflows/temp-adaptive-birefnet.yml .github/scripts/patch-adaptive-birefnet.mjs
          changed="$(git diff --cached origin/main --name-only)"
          test "$changed" = "src/components/BackgroundRemover.jsx"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Improve precision removal with adaptive BiRefNet [skip ci]'
          git push origin HEAD:improve/adaptive-birefnet-webgpu
