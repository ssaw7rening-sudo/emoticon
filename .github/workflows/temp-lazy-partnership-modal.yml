name: Temporary Lazy Partnership Modal

on:
  push:
    branches:
      - perf/lazy-partnership-modal

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/lazy-partnership-modal
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify and apply partnership modal lazy load
        run: node scripts/temp-lazy-partnership-modal.mjs
