name: Polish Grok prompt labels

on:
  push:
    paths:
      - '.github/workflows/polish-grok-prompt-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Polish Grok prompt and model labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')

          old = "    const selectedArtStyle = getSelectedArtStyle('en') || 'Realistic semi-caricature 2D illustration';"
          new = "    const selectedArtStyleTag = getSelectedArtStyle();\n    const selectedArtStyle = getExpandedArtStyleText(selectedArtStyleTag, false) || selectedArtStyleTag || 'Realistic semi-caricature 2D illustration';"
          if old not in s:
              raise SystemExit('Grok selectedArtStyle line not found')
          s = s.replace(old, new, 1)

          replacements = {
            'xAI Grok(Flux.1)': 'xAI Grok(Imagine Image 2.0)',
            'xAI Grok (Flux.1)': 'xAI Grok (Imagine Image 2.0)',
            '[대상 AI: Grok (xAI / Flux.1 엔진)]': '[대상 AI: Grok (xAI / Imagine Image 2.0)]',
            '[対象AI: Grok (xAI / Flux.1)]': '[対象AI: Grok (xAI / Imagine Image 2.0)]',
            '[目标AI: Grok (xAI / Flux.1)]': '[目标AI: Grok (xAI / Imagine Image 2.0)]',
            '[TARGET AI: Grok (xAI / Flux.1 Engine)]': '[TARGET AI: Grok (xAI / Imagine Image 2.0)]',
          }
          for old_text, new_text in replacements.items():
              s = s.replace(old_text, new_text)

          if 'Flux.1' in s:
              raise SystemExit('A Flux.1 reference still remains')

          p.write_text(s, encoding='utf-8')
          print('Expanded Grok art style and updated all Grok model labels.')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align Grok style expansion and model labels"
          git push
