name: Floating Sticker Components

on:
  push:
    branches: [fix/floating-sticker-components]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply floating component patch
        run: node .github/scripts/patch-floating-sticker-components.mjs
      - name: Remove temporary patch files
        run: rm .github/scripts/patch-floating-sticker-components.mjs .github/workflows/floating-sticker-components.yml
      - name: Stage and guard final diff
        run: |
          git add -A
          git diff --cached --check
          changed="$(git diff --cached origin/main --name-only | sort)"
          test "$changed" = "vite.precise-sticker-split.config.js"
          grep -q "precise-sticker-sheet-split-v8-floating-component-reattach" vite.precise-sticker-split.config.js
          grep -q "const floatingOverride = new Int16Array" vite.precise-sticker-split.config.js
          grep -q "bestBoundsDistance <= 0.72" vite.precise-sticker-split.config.js
          grep -q "finalGroupForSourcePixel(sourceX, sourceY)" vite.precise-sticker-split.config.js
      - run: npm ci
      - run: npm run build
      - name: Commit verified splitter change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reattach floating sticker captions and effects [skip ci]"
          git push origin HEAD
