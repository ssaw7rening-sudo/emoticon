name: Apply final settings summary

on:
  push:
    paths:
      - '.github/workflows/apply-final-settings-summary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Insert final settings checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          marker = '            {/* 1. Launch Info Header */}'
          guard = '            {/* Final settings checkpoint before AI launch */}'
          insert = base64.b64decode('').decode('utf-8')
          if guard in text:
              print('Checkpoint already present; no change needed.')
          else:
              if marker not in text:
                  raise SystemExit('Launch marker not found')
              text = text.replace(marker, insert + marker, 1)
              path.write_text(text, encoding='utf-8')
              print('Inserted final settings checkpoint.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Add final settings check before AI launch"
          git push
