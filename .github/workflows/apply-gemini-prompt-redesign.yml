name: Apply Gemini prompt redesign

on:
  push:
    paths:
      - '.github/workflows/apply-gemini-prompt-redesign.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Gemini snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          character = Path('.github/patches/gemini-character-details.jsx.txt').read_text(encoding='utf-8').rstrip()
          prompt = Path('.github/patches/gemini-prompt-generator.jsx.txt').read_text(encoding='utf-8').rstrip()

          start = text.index('  const getGeminiCharacterDetails =')
          end = text.index('\n\n  const getGptBackgroundInstruction =', start)
          text = text[:start] + character + text[end:]

          start = text.index('  const generateGeminiPrompt =')
          end = text.index('\n\n  const getGrokBackgroundInstruction =', start)
          text = text[:start] + prompt + text[end:]

          path.write_text(text, encoding='utf-8')
          print('Applied Gemini prompt redesign snippets')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Redesign Gemini sticker typography and composition"
          git push
