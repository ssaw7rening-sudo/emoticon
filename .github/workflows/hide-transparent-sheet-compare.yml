name: Hide Transparent Sheet Compare

on:
  push:
    paths:
      - '.github/workflows/hide-transparent-sheet-compare.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide compare UI for transparent sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/BackgroundRemover.jsx')
          text = path.read_text(encoding='utf-8')
          old = """          {!resultUrl ? (\n            <div className=\"overflow-hidden rounded-2xl border border-[#E2DDD5] bg-white\">"""
          new = """          {!resultUrl ? (\n            <div className=\"overflow-hidden rounded-2xl border border-[#E2DDD5] bg-white\">"""
          if old not in text:
              raise SystemExit('Initial preview conditional not found')
          # The opening branch stays unchanged. Only change the result branch after its closing marker.
          marker = """          ) : (\n            <div className=\"overflow-hidden rounded-2xl border border-[#D8E0D2] bg-white\">"""
          replacement = """          ) : inputKind === 'transparent-sheet' ? null : (\n            <div className=\"overflow-hidden rounded-2xl border border-[#D8E0D2] bg-white\">"""
          if marker not in text:
              raise SystemExit('Result compare branch not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify UI routing
        run: |
          grep -F "inputKind === 'transparent-sheet' ? null : (" src/components/BackgroundRemover.jsx
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - name: Build
        run: npm run build
      - name: Commit verified change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BackgroundRemover.jsx
          git rm -f .github/workflows/hide-transparent-sheet-compare.yml
          git commit -m 'Skip comparison UI for transparent sheets'
          git push
