name: Move edit controls into final settings

on:
  push:
    paths:
      - '.github/workflows/move-edit-buttons-into-final-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace final settings and launch controls block
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          replacement = Path('.github/patches/final-settings-edit-controls.jsx.txt').read_text(encoding='utf-8')

          start_marker = '            {/* Final settings edit controls */}'
          end_marker = '          <div id="ai-action-cards-grid" className="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4">'

          if start_marker not in text:
              raise SystemExit('Final settings edit-controls marker not found.')
          if end_marker not in text:
              raise SystemExit('AI action cards marker not found.')

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          print('Replaced final settings/edit controls block from UTF-8 snippet.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Move edit buttons into final settings card"
          git push
