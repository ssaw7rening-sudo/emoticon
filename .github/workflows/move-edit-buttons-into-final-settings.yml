name: Move edit controls into final settings

on:
  push:
    paths:
      - '.github/workflows/move-edit-buttons-into-final-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize final settings edit controls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          final_marker = '          {/* Final settings checkpoint after prompt preview */}'
          ad_marker = '          <AdBanner />'
          paragraph_tail = "                : 'Check these settings once more before launching or copying.'}"
          button_start_marker = '              <div className="grid grid-cols-2 gap-2 w-full sm:w-auto">'

          if final_marker not in text:
              raise SystemExit('Final settings card not found.')
          if paragraph_tail not in text:
              raise SystemExit('Final settings confirmation paragraph not found.')
          if button_start_marker not in text:
              raise SystemExit('Edit button container not found.')

          button_start = text.index(button_start_marker)
          themes_pos = text.index("'Themes ↑'", button_start)
          button_end = text.index('              </div>', themes_pos) + len('              </div>\n')
          buttons = text[button_start:button_end]

          buttons = buttons.replace(
              'className="grid grid-cols-2 gap-2 w-full sm:w-auto"',
              'className="grid grid-cols-2 gap-2 w-full"',
              1,
          )
          buttons = buttons.replace(
              'className="interactive-control flex items-center justify-center gap-1 min-h-[34px] bg-white hover:bg-[#D5EFE5] text-[#1E5D4B] font-black text-[12px] sm:text-[12.5px] px-3 py-1 rounded-lg border border-[#9ED2C0] shadow-2xs cursor-pointer active:scale-95 transition-all"',
              'className="interactive-control min-w-0 flex items-center justify-center gap-1 min-h-[38px] bg-white hover:bg-[#FFF7DF] text-[#6A5129] font-black text-[12px] sm:text-[12.5px] px-2.5 py-1.5 rounded-lg border border-[#E2C990] shadow-2xs cursor-pointer active:scale-95 transition-all"',
          )

          text = text[:button_start] + text[button_end:]

          final_start = text.index(final_marker)
          ad_pos = text.index(ad_marker, final_start)
          paragraph_pos = text.index(paragraph_tail, final_start)
          paragraph_end = text.index('            </p>', paragraph_pos) + len('            </p>\n')
          card_core = text[final_start:paragraph_end]

          edit_controls = (
              '            {/* Final settings edit controls */}\n'
              '            <div className="mt-3 pt-3 border-t border-[#EFE4C6]">\n'
              '              <div className="flex items-center gap-1.5 text-[11.5px] sm:text-[12px] font-bold text-[#8A7758] mb-2">\n'
              '                <span>💡</span>\n'
              '                <span>\n'
              "                  {lang === 'ko'\n"
              "                    ? '수정 시 실시간 자동 반영:'\n"
              "                    : lang === 'ja'\n"
              "                    ? '変更時にリアルタイム反映:'\n"
              "                    : lang === 'zh'\n"
              "                    ? '修改时实时自动同步:'\n"
              "                    : 'Real-time sync on edit:'}\n"
              '                </span>\n'
              '              </div>\n'
              + buttons
              + '            </div>\n'
          )

          rebuilt = card_core + edit_controls + '          </div>\n\n'
          text = text[:final_start] + rebuilt + text[ad_pos:]

          path.write_text(text, encoding='utf-8')
          print('Normalized final settings card and moved both edit buttons inside it.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Finish moving edit controls into final settings"
          git push
